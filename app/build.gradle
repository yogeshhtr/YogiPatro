plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yogi.patro'
    compileSdk 34

    defaultConfig {
        applicationId "com.yogi.patro"
        minSdk 21
        targetSdk 34
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode run
        versionName "1.${run}"
    }

    // Same key for every build, so a new APK installs OVER the old one (keeps your reminders).
    signingConfigs {
        yogi {
            storeFile rootProject.file('yogipatro.p12')
            storePassword 'yogitv-private'
            keyAlias 'yogi'
            keyPassword 'yogitv-private'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.yogi }
        release {
            // optimized and shrunk by R8: small and fast
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.yogi
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}
